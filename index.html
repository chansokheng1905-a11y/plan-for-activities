<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ផែនការជីវិត & រំលឹកកិច្ចការវៃឆ្លាត - PlanMaster Pro (Cloud Sync)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kantumruy Pro & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Kantumruy Pro"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-urgent {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-40 glass border-b border-slate-200/80 dark:border-slate-800/80 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 rtl:space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-brand-600 via-indigo-600 to-violet-600 bg-clip-text text-transparent dark:from-brand-400 dark:to-violet-400">
                        PlanMaster Pro
                    </h1>
                    <div class="flex items-center space-x-2 text-xs">
                        <span id="cloudStatusBadge" class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-600 dark:text-emerald-400">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Cloud Synced (Online)
                        </span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6">

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="glass p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-list-ul"></i>
                </div>
                <div>
                    <div id="statTotal" class="text-xl font-bold leading-tight">0</div>
                    <div class="text-xs text-slate-500">កិច្ចការសរុប</div>
                </div>
            </div>
            <div class="glass p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center text-lg">
                    <i class="fa-regular fa-clock"></i>
                </div>
                <div>
                    <div id="statPending" class="text-xl font-bold leading-tight">0</div>
                    <div class="text-xs text-slate-500">ត្រូវធ្វើខាងមុខ</div>
                </div>
            </div>
            <div class="glass p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <div id="statOverdue" class="text-xl font-bold leading-tight">0</div>
                    <div class="text-xs text-slate-500">ហួសកាលកំណត់</div>
                </div>
            </div>
            <div class="glass p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <div id="statCompleted" class="text-xl font-bold leading-tight">0</div>
                    <div class="text-xs text-slate-500">រួចរាល់</div>
                </div>
            </div>
        </div>

        <!-- Add Task Form -->
        <div class="glass p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
            <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-slate-800 dark:text-slate-100">
                <i class="fa-solid fa-plus-circle text-brand-600 dark:text-brand-400"></i>
                គ្រោងកិច្ចការថ្មី (Add New Task)
            </h2>
            <form id="taskForm" onsubmit="handleAddTask(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div class="md:col-span-6">
                        <input type="text" id="taskTitle" required placeholder="ឈ្មោះកិច្ចការ ឬសកម្មភាពដែលត្រូវធ្វើ..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="md:col-span-3">
                        <input type="datetime-local" id="taskDateTime" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="md:col-span-3">
                        <select id="taskPriority" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="high">🚨 សំខាន់ និងបន្ទាន់ (High)</option>
                            <option value="medium" selected>⚡ មធ្យម (Medium)</option>
                            <option value="low">🌱 ធម្មតា (Low)</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <p class="text-xs text-slate-500"><i class="fa-solid fa-cloud text-emerald-500 mr-1"></i> ទិន្នន័យ Sync ស្វ័យប្រវត្តិតាម Cloud Database</p>
                    <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-medium shadow-md shadow-brand-500/20 transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> រក្សាទុកកិច្ចការ
                    </button>
                </div>
            </form>
        </div>

        <!-- Task List Header & Filters -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
                <button onclick="setFilter('all')" id="filterAll" class="filter-btn active px-3.5 py-1.5 rounded-xl text-xs font-medium bg-brand-600 text-white shadow-sm">ទាំងអស់</button>
                <button onclick="setFilter('pending')" id="filterPending" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 border border-slate-200 dark:border-slate-700">នៅសល់</button>
                <button onclick="setFilter('completed')" id="filterCompleted" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 border border-slate-200 dark:border-slate-700">រួចរាល់</button>
            </div>
            <div class="text-xs text-slate-500">
                <span id="syncIndicator"><i class="fa-solid fa-arrows-rotate mr-1"></i> Syncing...</span>
            </div>
        </div>

        <!-- Tasks Container -->
        <div id="taskList" class="space-y-3"></div>

    </main>

    <!-- Alarm Popup Modal -->
    <div id="alarmModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border-2 border-rose-500 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl space-y-4 pulse-urgent">
            <div class="w-16 h-16 bg-rose-100 dark:bg-rose-950/80 text-rose-600 dark:text-rose-400 rounded-2xl flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-bell animate-bounce"></i>
            </div>
            <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-rose-600 bg-rose-50 dark:bg-rose-950/40 px-2.5 py-1 rounded-full">ដល់ម៉ោងត្រូវធ្វើហើយ!</span>
                <h3 id="alarmTaskTitle" class="text-lg font-bold mt-2 text-slate-900 dark:text-slate-100">-</h3>
                <p id="alarmTaskTime" class="text-xs text-slate-500 mt-1">-</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="dismissAlarm()" class="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
                    បិទសំឡេង
                </button>
                <button id="alarmCompleteBtn" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium shadow-md">
                    ✓ ធ្វើរួចរាល់
                </button>
            </div>
        </div>
    </div>

    <script>
        // Direct Firebase Config of Chan
        const firebaseConfig = {
            apiKey: "AIzaSyDBTmY6YKLmpQ4mqAZm96P39IYtR4uQvtE",
            authDomain: "my-planner-app-e9576.firebaseapp.com",
            projectId: "my-planner-app-e9576",
            storageBucket: "my-planner-app-e9576.firebasestorage.app",
            messagingSenderId: "820137960838",
            appId: "1:820137960838:web:df39f02662e2aff521b807",
            measurementId: "G-9LCSDVH7C5"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let tasks = [];
        let currentFilter = 'all';
        let audioCtx = null;

        // Sound chime generator
        function playChime() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 1.2);
            } catch (e) {
                console.log(e);
            }
        }

        // Real-time Cloud Listener (Auto sync phone & PC)
        db.collection('tasks').orderBy('dateTime', 'asc').onSnapshot((snapshot) => {
            tasks = [];
            snapshot.forEach((doc) => {
                tasks.push({ id: doc.id, ...doc.data() });
            });
            renderTasks();
            updateStats();
            document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-cloud-check text-emerald-500 mr-1"></i> Sync រួចរាល់';
        }, (err) => {
            console.error("Firestore sync error:", err);
            document.getElementById('syncIndicator').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1"></i> Sync Error';
        });

        // Add Task
        async function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value.trim();
            const dateTime = document.getElementById('taskDateTime').value;
            const priority = document.getElementById('taskPriority').value;

            if (!title || !dateTime) return;

            await db.collection('tasks').add({
                title,
                dateTime,
                priority,
                completed: false,
                notified: false,
                createdAt: new Date().toISOString()
            });

            document.getElementById('taskForm').reset();
        }

        // Toggle Complete
        async function toggleComplete(id, currentStatus) {
            await db.collection('tasks').doc(id).update({
                completed: !currentStatus
            });
        }

        // Delete Task
        async function deleteTask(id) {
            if (!confirm('តើអ្នកប្រាកដជាចង់លុបកិច្ចការនេះមែនទេ?')) return;
            await db.collection('tasks').doc(id).delete();
        }

        // Render Tasks
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            let filtered = tasks;
            if (currentFilter === 'pending') filtered = tasks.filter(t => !t.completed);
            if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 glass rounded-2xl border border-slate-200/80 dark:border-slate-800">
                        <i class="fa-regular fa-calendar-check text-4xl text-slate-300 dark:text-slate-600 mb-2"></i>
                        <p class="text-sm text-slate-500">គ្មានកិច្ចការក្នុងបញ្ជីនេះឡើយ</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(task => {
                const isOverdue = !task.completed && new Date(task.dateTime) < new Date();
                const card = document.createElement('div');
                card.className = `glass p-4 rounded-2xl border ${task.completed ? 'opacity-60 border-slate-200 dark:border-slate-800' : isOverdue ? 'border-rose-300 dark:border-rose-900 bg-rose-50/20' : 'border-slate-200/80 dark:border-slate-800'} shadow-sm flex items-center justify-between gap-3`;

                const priorityBadge = task.priority === 'high' 
                    ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 font-semibold">🚨 បន្ទាន់</span>'
                    : task.priority === 'medium'
                    ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 font-semibold">⚡ មធ្យម</span>'
                    : '<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 font-semibold">🌱 ធម្មតា</span>';

                card.innerHTML = `
                    <div class="flex items-center space-x-3 rtl:space-x-reverse min-w-0">
                        <button onclick="toggleComplete('${task.id}', ${task.completed})" class="w-6 h-6 rounded-lg border ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600'} flex items-center justify-center shrink-0">
                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <div class="min-w-0">
                            <h4 class="text-sm font-semibold truncate ${task.completed ? 'line-through text-slate-400' : ''}">${task.title}</h4>
                            <div class="flex items-center gap-2 mt-1 text-xs text-slate-500">
                                <span><i class="fa-regular fa-clock mr-1"></i>${new Date(task.dateTime).toLocaleString('km-KH', { dateStyle: 'short', timeStyle: 'short' })}</span>
                                ${priorityBadge}
                                ${isOverdue ? '<span class="text-rose-500 font-bold text-[11px]">(ហួសពេល)</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-500 p-2 transition">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                `;
                list.appendChild(card);
            });
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const now = new Date();
            const overdue = tasks.filter(t => !t.completed && new Date(t.dateTime) < now).length;
            const pending = total - completed;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCompleted').innerText = completed;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statOverdue').innerText = overdue;
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 border border-slate-200 dark:border-slate-700";
            });
            if (f === 'all') document.getElementById('filterAll').className = "filter-btn active px-3.5 py-1.5 rounded-xl text-xs font-medium bg-brand-600 text-white shadow-sm";
            if (f === 'pending') document.getElementById('filterPending').className = "filter-btn active px-3.5 py-1.5 rounded-xl text-xs font-medium bg-brand-600 text-white shadow-sm";
            if (f === 'completed') document.getElementById('filterCompleted').className = "filter-btn active px-3.5 py-1.5 rounded-xl text-xs font-medium bg-brand-600 text-white shadow-sm";
            renderTasks();
        }

        // Alarm system
        setInterval(() => {
            const now = new Date();
            tasks.forEach(task => {
                if (!task.completed && !task.notified) {
                    const taskTime = new Date(task.dateTime);
                    if (now >= taskTime && (now - taskTime) < 5 * 60 * 1000) {
                        task.notified = true;
                        playChime();
                        document.getElementById('alarmTaskTitle').innerText = task.title;
                        document.getElementById('alarmTaskTime').innerText = new Date(task.dateTime).toLocaleString('km-KH');
                        document.getElementById('alarmModal').classList.remove('hidden');
                        document.getElementById('alarmModal').classList.add('flex');
                        document.getElementById('alarmCompleteBtn').onclick = () => {
                            toggleComplete(task.id, false);
                            dismissAlarm();
                        };
                    }
                }
            });
        }, 4000);

        function dismissAlarm() {
            document.getElementById('alarmModal').classList.add('hidden');
            document.getElementById('alarmModal').classList.remove('flex');
        }

        // Theme Toggle
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon';
        }
    </script>
</body>
</html>
